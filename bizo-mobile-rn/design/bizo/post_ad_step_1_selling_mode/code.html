<!DOCTYPE html>

<html class="light" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;700;800;900&amp;family=Inter:wght@300;400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "primary": "#745b00",
                    "on-secondary-container": "#636262",
                    "surface-variant": "#e1e3e4",
                    "on-tertiary": "#ffffff",
                    "secondary": "#5f5e5e",
                    "on-error-container": "#93000a",
                    "tertiary-container": "#49dbff",
                    "on-tertiary-fixed": "#001f27",
                    "surface-container-high": "#e7e8e9",
                    "inverse-surface": "#2e3132",
                    "tertiary-fixed": "#b0ecff",
                    "primary-fixed": "#ffe08b",
                    "tertiary-fixed-dim": "#42d7fb",
                    "on-secondary-fixed": "#1c1b1b",
                    "surface-container-low": "#f3f4f5",
                    "secondary-fixed": "#e5e2e1",
                    "on-tertiary-fixed-variant": "#004e5e",
                    "on-primary": "#ffffff",
                    "on-surface": "#191c1d",
                    "surface-tint": "#745b00",
                    "surface-container": "#edeeef",
                    "on-tertiary-container": "#005e70",
                    "secondary-container": "#e2dfde",
                    "inverse-primary": "#f0c110",
                    "surface-bright": "#f8f9fa",
                    "surface": "#f8f9fa",
                    "inverse-on-surface": "#f0f1f2",
                    "secondary-fixed-dim": "#c8c6c5",
                    "on-error": "#ffffff",
                    "on-background": "#191c1d",
                    "outline": "#807660",
                    "on-secondary-fixed-variant": "#474746",
                    "surface-container-lowest": "#ffffff",
                    "on-surface-variant": "#4e4633",
                    "error": "#ba1a1a",
                    "background": "#f8f9fa",
                    "primary-container": "#f5c518",
                    "surface-dim": "#d9dadb",
                    "on-primary-fixed": "#241a00",
                    "error-container": "#ffdad6",
                    "on-primary-container": "#695200",
                    "primary-fixed-dim": "#f0c110",
                    "on-primary-fixed-variant": "#584400"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "section-gap": "32px",
                    "gutter": "12px",
                    "container-margin": "20px",
                    "base": "8px"
            },
            "fontFamily": {
                    "headline-lg-mobile": ["Archivo Narrow"],
                    "label-bold": ["Inter"],
                    "body-sm": ["Inter"],
                    "body-md": ["Inter"],
                    "headline-md": ["Archivo Narrow"],
                    "headline-lg": ["Archivo Narrow"],
                    "display": ["Archivo Narrow"],
                    "body-lg": ["Inter"]
            },
            "fontSize": {
                    "headline-lg-mobile": ["24px", {"lineHeight": "1.2", "fontWeight": "900"}],
                    "label-bold": ["12px", {"lineHeight": "1", "fontWeight": "700"}],
                    "body-sm": ["14px", {"lineHeight": "1.4", "fontWeight": "400"}],
                    "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "300"}],
                    "headline-md": ["20px", {"lineHeight": "1.3", "fontWeight": "800"}],
                    "headline-lg": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "900"}],
                    "display": ["40px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "900"}],
                    "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "300"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .active-card {
            border-color: #191c1d !important;
            border-width: 2px !important;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08) !important;
        }
        .step-transition {
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        body {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body-md text-on-surface">
<!-- Top Navigation -->
<header class="w-full bg-surface-container-lowest sticky top-0 z-50 transition-opacity duration-200">
<div class="flex justify-between items-center px-container-margin py-4 w-full">
<button class="flex items-center justify-center p-2 -ml-2 hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined text-on-surface">close</span>
</button>
<h1 class="font-label-bold text-[15px] font-bold text-on-surface">Publier une annonce</h1>
<button class="flex items-center gap-1.5 text-[#5B5BD6] hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined text-[18px]">save</span>
<span class="font-label-bold">Brouillon</span>
</button>
</div>
</header>
<!-- Progress Indicator -->
<div class="w-full bg-surface-container-lowest">
<div class="w-full h-[4px] bg-surface-variant relative">
<div class="absolute top-0 left-0 h-full bg-primary-container step-transition" style="width: 14.28%;"></div>
</div>
<div class="px-container-margin py-2 text-right">
<span class="font-label-bold text-secondary text-[12px]">Étape 1 sur 7</span>
</div>
</div>
<!-- Main Content Canvas -->
<main class="px-container-margin pt-6 pb-32">
<header class="mb-section-gap">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile mb-2">Comment souhaitez-vous vendre ?</h2>
<p class="font-body-sm text-body-sm text-secondary">Choisissez le mode qui correspond à votre annonce.</p>
</header>
<!-- Mode Selection Group -->
<div class="flex flex-col gap-4" id="selection-group">
<!-- Card 1 -->
<button class="mode-card relative w-full text-left bg-surface-container-lowest p-5 rounded-xl border border-surface-variant transition-all duration-200 active:scale-[0.98] shadow-[0_4px_20px_0_rgba(0,0,0,0.04)]" onclick="selectCard(this)">
<div class="flex items-start gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface">sell</span>
</div>
<div>
<h3 class="font-label-bold text-body-lg text-on-surface font-bold">Vente classique</h3>
<p class="font-body-sm text-body-sm text-secondary mt-1">Fixez un prix et vendez directement</p>
</div>
</div>
<div class="check-icon absolute top-4 right-4 hidden">
<span class="material-symbols-outlined text-on-surface" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</button>
<!-- Card 2 -->
<button class="mode-card relative w-full text-left bg-surface-container-lowest p-5 rounded-xl border border-surface-variant transition-all duration-200 active:scale-[0.98] shadow-[0_4px_20px_0_rgba(0,0,0,0.04)]" onclick="selectCard(this)">
<div class="flex items-start gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface">refresh</span>
</div>
<div>
<h3 class="font-label-bold text-body-lg text-on-surface font-bold">Troc</h3>
<p class="font-body-sm text-body-sm text-secondary mt-1">Échangez votre objet contre un autre</p>
</div>
</div>
<div class="check-icon absolute top-4 right-4 hidden">
<span class="material-symbols-outlined text-on-surface" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</button>
<!-- Card 3 (Popular) -->
<button class="mode-card relative w-full text-left bg-surface-container-lowest p-5 rounded-xl border border-surface-variant transition-all duration-200 active:scale-[0.98] shadow-[0_4px_20px_0_rgba(0,0,0,0.04)]" onclick="selectCard(this)">
<div class="flex items-start gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center relative">
<span class="material-symbols-outlined text-on-surface">swap_horizontal_circle</span>
<div class="absolute -bottom-1 -right-1 bg-primary-container rounded-full w-5 h-5 flex items-center justify-center border-2 border-surface-container-lowest">
<span class="material-symbols-outlined text-[12px] text-on-primary-container" style="font-variation-settings: 'FILL' 1;">payments</span>
</div>
</div>
<div>
<div class="flex items-center gap-2">
<h3 class="font-label-bold text-body-lg text-on-surface font-bold">Troc + Complément</h3>
<span class="bg-primary-container text-on-primary-container text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider">Populaire</span>
</div>
<p class="font-body-sm text-body-sm text-secondary mt-1">Échangez et recevez un complément en cash</p>
</div>
</div>
<div class="check-icon absolute top-4 right-4 hidden">
<span class="material-symbols-outlined text-on-surface" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</button>
</div>
</main>
<!-- Bottom Sticky CTA -->
<footer class="fixed bottom-0 left-0 w-full bg-surface-container-lowest p-container-margin pb-safe-offset-4 shadow-[0_-8px_32px_rgba(0,0,0,0.08)] z-50">
<div class="max-w-[1200px] mx-auto">
<button class="w-full bg-inverse-surface text-inverse-on-surface h-14 rounded-full flex items-center justify-center gap-2 font-label-bold text-body-lg transition-all duration-200 disabled:opacity-30 active:scale-95 shadow-[0_8px_24px_rgba(0,0,0,0.12)]" disabled="" id="continue-btn">
                Continuer
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</footer>
<script>
        function selectCard(element) {
            // Remove active state from all cards
            const cards = document.querySelectorAll('.mode-card');
            cards.forEach(card => {
                card.classList.remove('active-card');
                card.querySelector('.check-icon').classList.add('hidden');
            });

            // Add active state to selected card
            element.classList.add('active-card');
            element.querySelector('.check-icon').classList.remove('hidden');

            // Enable CTA button
            const btn = document.getElementById('continue-btn');
            btn.disabled = false;
            
            // Subtle haptic feel simulation
            if (window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate(5);
            }
        }

        // Add padding for safe areas if on modern mobile devices
        if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) {
            document.body.classList.add('pt-12');
        }
    </script>
</body></html>
