<script>
        // Micro-interactions and Tab Active Logic
        document.querySelectorAll('nav button').forEach(btn => {
            btn.addEventListener('click', () => {
                // Mock behavior for switching tabs
                console.log('Tab switched to: ' + btn.innerText.trim());
            });
        });

        // Search bar focus effect
        const searchInput = document.querySelector('input');
        const searchContainer = searchInput.parentElement;
        searchInput.addEventListener('focus', () => {
            searchContainer.classList.add('border-primary-container');
        });
        searchInput.addEventListener('blur', () => {
            searchContainer.classList.remove('border-primary-container');
        });
    </script>
