<!DOCTYPE html>

<html class="light" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "background": "#f8f9fa",
                      "tertiary-fixed-dim": "#42d7fb",
                      "surface": "#f8f9fa",
                      "on-primary-container": "#695200",
                      "inverse-surface": "#2e3132",
                      "inverse-primary": "#f0c110",
                      "secondary-fixed-dim": "#c8c6c5",
                      "primary": "#745b00",
                      "on-tertiary": "#ffffff",
                      "on-primary-fixed-variant": "#584400",
                      "on-error-container": "#93000a",
                      "surface-container-highest": "#e1e3e4",
                      "on-surface-variant": "#4e4633",
                      "on-primary-fixed": "#241a00",
                      "on-primary": "#ffffff",
                      "secondary": "#5f5e5e",
                      "outline-variant": "#d1c5ac",
                      "primary-fixed-dim": "#f0c110",
                      "primary-fixed": "#ffe08b",
                      "surface-container-high": "#e7e8e9",
                      "inverse-on-surface": "#f0f1f2",
                      "secondary-fixed": "#e5e2e1",
                      "secondary-container": "#e2dfde",
                      "on-background": "#191c1d",
                      "on-secondary-container": "#636262",
                      "on-tertiary-fixed": "#001f27",
                      "tertiary-container": "#49dbff",
                      "surface-container-low": "#f3f4f5",
                      "error": "#ba1a1a",
                      "surface-container": "#edeeef",
                      "on-tertiary-fixed-variant": "#004e5e",
                      "surface-tint": "#745b00",
                      "surface-container-lowest": "#ffffff",
                      "on-error": "#ffffff",
                      "on-surface": "#191c1d",
                      "outline": "#807660",
                      "on-secondary": "#ffffff",
                      "on-secondary-fixed-variant": "#474746",
                      "surface-variant": "#e1e3e4",
                      "surface-bright": "#f8f9fa",
                      "on-tertiary-container": "#005e70",
                      "primary-container": "#f5c518",
                      "error-container": "#ffdad6",
                      "tertiary": "#00687c",
                      "surface-dim": "#d9dadb",
                      "on-secondary-fixed": "#1c1b1b",
                      "tertiary-fixed": "#b0ecff"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "gutter": "12px",
                      "container-margin": "20px",
                      "base": "8px",
                      "section-gap": "32px"
              },
              "fontFamily": {
                      "body-md": ["Inter"],
                      "label-bold": ["Inter"],
                      "display": ["Archivo Narrow"],
                      "headline-md": ["Archivo Narrow"],
                      "body-lg": ["Inter"],
                      "body-sm": ["Inter"],
                      "headline-lg-mobile": ["Archivo Narrow"],
                      "headline-lg": ["Archivo Narrow"]
              },
              "fontSize": {
                      "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "300"}],
                      "label-bold": ["12px", {"lineHeight": "1", "fontWeight": "700"}],
                      "display": ["40px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "900"}],
                      "headline-md": ["20px", {"lineHeight": "1.3", "fontWeight": "800"}],
                      "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "300"}],
                      "body-sm": ["14px", {"lineHeight": "1.4", "fontWeight": "400"}],
                      "headline-lg-mobile": ["24px", {"lineHeight": "1.2", "fontWeight": "900"}],
                      "headline-lg": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "900"}]
              }
            },
          },
        }
    </script>
<style>
        body {
            background-color: #ffffff;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }
        .illustration-gradient {
            background: linear-gradient(to bottom, #ffffff 0%, #E0E7FF 100%);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
<!-- Main Device Container (iPhone 13 sized) -->
<div class="relative w-[390px] h-[844px] bg-background shadow-2xl overflow-hidden flex flex-col">
<!-- TOP AREA (Illustration Zone) -->
<div class="relative w-full h-[420px] illustration-gradient flex items-center justify-center pt-10">
<!-- Skip Action (TopAppBar Style Mapping) -->
<div class="absolute top-0 w-full z-50 flex items-center justify-end px-container-margin h-16">
<button class="text-secondary dark:text-secondary-fixed-dim font-body-sm text-body-sm active:scale-95 transition-transform">
                    Passer
                </button>
</div>
<!-- Illustration Container -->
<div class="w-full h-full flex items-center justify-center px-8">
<img alt="Bizo Onboarding Illustration" class="max-w-full max-h-[320px] object-contain transform hover:scale-105 transition-transform duration-700 ease-out drop-shadow-sm" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB1u1xjuSpRGyfxp0JE-o-cZehqUXtukQ4coYPsnSjdKIziVhEGQHCze9GPIfp2DnEiMStD9z2kABZj63ie_XYVXZZ6XpeSIsDBGbgmH2nP0iJVsvrz9LMucyL675e3s_cEGc5Y2vqtUBk0uyrSGNdWyvXc___--o_nqHHXySxlMnEWIjjaZZTVWBOozZ5Os4nYFoV3c-27UYrOrwBK4OCGrhteBVPWc7L4dDr-rIF6hwb8Q0Q-GsekonB9hj9E9GRoKM2Iq08KgRk"/>
</div>
</div>
<!-- BOTTOM CONTENT AREA (White Card) -->
<div class="flex-grow bg-surface-container-lowest rounded-t-[24px] shadow-[0_-8px_32px_rgba(0,0,0,0.06)] px-8 pt-8 pb-10 flex flex-col relative z-10 -mt-6">
<!-- SLIDE INDICATOR -->
<div class="flex items-center gap-2 mb-8">
<div class="w-2 h-2 rounded-full bg-secondary-fixed-dim"></div>
<div class="w-6 h-2 rounded-full bg-primary-container"></div>
<div class="w-2 h-2 rounded-full bg-secondary-fixed-dim"></div>
<div class="w-2 h-2 rounded-full bg-secondary-fixed-dim"></div>
</div>
<!-- HEADING -->
<h1 class="font-headline-lg-mobile text-[28px] leading-[1.1] text-on-surface mb-3 whitespace-pre-line tracking-tight">
                Le troc
                réinventé
            </h1>
<!-- SUBTEXT -->
<p class="font-body-md text-[15px] leading-relaxed text-secondary-fixed-dim text-secondary-fixed-variant mb-auto">
                Échangez vos objets, proposez un complément cash. Troc simple, troc + cash, à vous de choisir.
            </p>
<!-- NEXT BUTTON -->
<div class="mt-8">
<button class="w-full h-[52px] bg-inverse-surface text-surface-container-lowest rounded-full flex items-center justify-center gap-2 font-headline-md text-headline-md active:scale-95 transition-all shadow-lg">
<span>Suivant</span>
<span class="material-symbols-outlined" style="font-variation-settings: 'wght' 600">arrow_forward</span>
</button>
</div>
<!-- iOS Home Indicator (Visual Only) -->
<div class="absolute bottom-2 left-1/2 -translate-x-1/2 w-32 h-1 bg-on-background/10 rounded-full"></div>
</div>
</div>
<script>
        // Subtle entrance animation for the content
        document.addEventListener('DOMContentLoaded', () => {
            const card = document.querySelector('.bg-surface-container-lowest');
            card.style.opacity = '0';
            card.style.transform = 'translateY(20px)';
            
            setTimeout(() => {
                card.style.transition = 'all 0.6s cubic-bezier(0.2, 0.8, 0.2, 1)';
                card.style.opacity = '1';
                card.style.transform = 'translateY(0)';
            }, 100);
        });
    </script>
</body></html>
