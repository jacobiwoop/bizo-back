<style>

            color: white;
            overflow: hidden;

        }

            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

<body class="font-body-md">

<span class="material-symbols-outlined text-white" data-icon="download">download</span>

<!-- Bottom Bar -->
<footer class="ui-element fixed bottom-0 left-0 right-0 z-50 bg-gradient-to-t from-black via-black/90 to-transparent pt-20 pb-10 px-4" id="bottom-bar">

</main>
<script>
        let uiVisible = true;
        const topBar = document.getElementById('top-bar');
        const bottomBar = document.getElementById('bottom-bar');
        const thumbStrip = document.getElementById('thumbnail-strip');

        function toggleUI() {
            uiVisible = !uiVisible;
            if (uiVisible) {
                topBar.classList.remove('ui-hidden');
                bottomBar.classList.remove('ui-hidden');
                thumbStrip.classList.remove('ui-hidden');
                topBar.classList.remove('-translate-y-full');
                bottomBar.classList.remove('translate-y-full');
            } else {
                topBar.classList.add('ui-hidden');
                bottomBar.classList.add('ui-hidden');
                thumbStrip.classList.add('ui-hidden');
                topBar.classList.add('-translate-y-full');
                bottomBar.classList.add('translate-y-full');
            }
        }

        // Handle thumbnail scrolling behavior
        const scrollContainer = document.getElementById('thumbnail-strip');
        scrollContainer.addEventListener('wheel', (evt) => {
            evt.preventDefault();
            scrollContainer.scrollLeft += evt.deltaY;
        });
    </script>
