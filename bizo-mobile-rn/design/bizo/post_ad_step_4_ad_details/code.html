<style>
        body {
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
            max-width: 390px;
            margin: 0 auto;
            position: relative;
            min-height: 100vh;

<body class="bg-surface text-on-surface">
<!-- TOP NAV -->
<nav class="sticky top-0 z-50 bg-surface-container-lowest px-4 py-4 flex justify-between items-center w-full">
<button class="p-1 hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined text-on-surface">close</span>
</button>
<h1 class="font-label-bold text-label-bold text-[15px] text-on-surface">Publier une annonce</h1>
<button class="font-label-bold text-label-bold text-[13px] text-[#5B5BD6] hover:underline">
            Brouillon
        </button>
</nav>
<!-- PROGRESS BAR -->
<div class="px-container-margin mt-2">
<div class="flex justify-end mb-2">
<span class="font-label-bold text-[11px] text-secondary">Étape 4 sur 7</span>
</div>
<div class="w-full bg-surface-container-high h-1.5 rounded-full overflow-hidden">
<div class="bg-primary-container h-full w-[57%] transition-all duration-500 ease-out"></div>
</div>
</div>
<main class="px-container-margin py-6 pb-32">
<!-- HEADING -->
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-4">Décrivez votre article</h2>
<!-- CATEGORY CHIP -->
<div class="inline-flex items-center gap-2 bg-on-surface text-surface py-2 px-3 rounded-full mb-8 shadow-sm">
<span class="material-symbols-outlined text-[18px]">smartphone</span>
<span class="font-label-bold text-[12px]">Électronique › Smartphones</span>
<span class="material-symbols-outlined text-[16px] ml-1 opacity-80">edit</span>
</div>
<!-- FORM FIELDS -->
<div class="flex flex-col gap-6">
<!-- TITRE -->
<div class="flex flex-col gap-2">
<label class="font-label-bold text-[13px] text-on-surface">Titre de l'annonce</label>
<div class="relative">
<input class="w-full h-12 px-4 bg-surface-container-lowest border border-surface-container-highest rounded-xl text-body-md font-body-md placeholder:text-secondary/50 transition-all" maxlength="80" placeholder="Ex: iPhone 13 Pro 256Go Bleu" type="text"/>
<span class="absolute bottom-[-18px] right-0 font-label-bold text-[10px] text-secondary">0/80</span>
</div>
</div>
<!-- DESCRIPTION -->
<div class="flex flex-col gap-2 mt-2">
<label class="font-label-bold text-[13px] text-on-surface">Description</label>
<div class="relative">
<textarea class="w-full h-[120px] px-4 py-3 bg-surface-container-lowest border border-surface-container-highest rounded-xl text-body-md font-body-md placeholder:text-secondary/50 resize-none transition-all" maxlength="1000" placeholder="Décrivez l'état, les accessoires inclus..."></textarea>
<span class="absolute bottom-[-18px] right-0 font-label-bold text-[10px] text-secondary">0/1000</span>
</div>
</div>
<!-- CARACTERISTIQUES SECTION -->
<div class="mt-8">
<div class="flex items-center gap-4 mb-6">
<h3 class="font-label-bold text-[14px] text-on-surface shrink-0">Caractéristiques</h3>
<div class="h-[1px] w-full bg-surface-container-highest"></div>
</div>
<div class="flex flex-col gap-6">
<!-- ETAT CHIPS -->
<div class="flex flex-col gap-3">
<label class="font-label-bold text-[13px] text-on-surface">État</label>
<div class="flex gap-2 overflow-x-auto hide-scrollbar pb-1">
<button class="shrink-0 px-4 py-2 rounded-full border border-surface-container-highest bg-surface-container-lowest text-[12px] font-label-bold text-on-surface hover:border-primary-container active:scale-95 transition-all">Neuf</button>
<button class="shrink-0 px-4 py-2 rounded-full border border-primary text-primary bg-primary/5 text-[12px] font-label-bold ring-1 ring-primary transition-all">Très bon état</button>
<button class="shrink-0 px-4 py-2 rounded-full border border-surface-container-highest bg-surface-container-lowest text-[12px] font-label-bold text-on-surface hover:border-primary-container transition-all">Bon état</button>
<button class="shrink-0 px-4 py-2 rounded-full border border-surface-container-highest bg-surface-container-lowest text-[12px] font-label-bold text-on-surface hover:border-primary-container transition-all">État correct</button>
<button class="shrink-0 px-4 py-2 rounded-full border border-surface-container-highest bg-surface-container-lowest text-[12px] font-label-bold text-on-surface hover:border-primary-container transition-all">Pour pièces</button>
</div>
</div>
<!-- MARQUE -->
<div class="flex flex-col gap-2">
<label class="font-label-bold text-[13px] text-on-surface">Marque</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-secondary text-[20px]">search</span>
<input class="w-full h-12 pl-11 pr-4 bg-surface-container-lowest border border-surface-container-highest rounded-xl text-body-md font-body-md transition-all" placeholder="Ex: Apple" type="text"/>
</div>
</div>
<!-- MODELE -->
<div class="flex flex-col gap-2">
<label class="font-label-bold text-[13px] text-on-surface">Modèle</label>
<input class="w-full h-12 px-4 bg-surface-container-lowest border border-surface-container-highest rounded-xl text-body-md font-body-md transition-all" placeholder="Ex: iPhone 13 Pro" type="text"/>
</div>
<!-- CAPACITE -->
<div class="flex flex-col gap-2">
<label class="font-label-bold text-[13px] text-on-surface">Capacité de stockage</label>
<div class="relative">
<select class="w-full h-12 px-4 bg-surface-container-lowest border border-surface-container-highest rounded-xl text-body-md font-body-md appearance-none transition-all">
<option disabled="" selected="">Sélectionner</option>
<option>64 Go</option>
<option>128 Go</option>
<option>256 Go</option>
<option>512 Go</option>
<option>1 To</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-secondary pointer-events-none">expand_more</span>
</div>
</div>
</div>
</div>
</div>
</main>
<!-- BOTTOM STICKY BUTTON -->
<div class="fixed bottom-0 left-0 right-0 p-4 bg-surface/80 backdrop-blur-md border-t border-surface-container-highest flex justify-center max-w-[390px] mx-auto z-50">
<button class="w-full h-12 bg-on-surface text-surface rounded-full flex items-center justify-center gap-2 font-label-bold text-[16px] active:scale-[0.98] transition-all shadow-xl">
            Continuer
            <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
<!-- BACKGROUND ATMOSPHERICS (Micro-interaction layer) -->
<div class="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none opacity-40">
<div class="absolute top-[10%] right-[-10%] w-64 h-64 bg-primary-container/20 rounded-full blur-[100px]"></div>
<div class="absolute bottom-[20%] left-[-10%] w-80 h-80 bg-tertiary-container/10 rounded-full blur-[120px]"></div>
</div>
<script>
        // Simple character counters interaction
        const inputs = document.querySelectorAll('input, textarea');
        inputs.forEach(input => {
            input.addEventListener('input', (e) => {
                const counter = e.target.nextElementSibling;
                if (counter && counter.tagName === 'SPAN') {
                    const max = e.target.getAttribute('maxlength');
                    counter.innerText = `${e.target.value.length}/${max}`;
                    if (e.target.value.length >= max) {
                        counter.classList.add('text-error');
                    } else {
                        counter.classList.remove('text-error');
                    }
                }
            });
        });

        // State chips selection interaction
        const stateChips = document.querySelectorAll('.overflow-x-auto button');
        stateChips.forEach(chip => {
            chip.addEventListener('click', () => {
                stateChips.forEach(c => {
                    c.className = "shrink-0 px-4 py-2 rounded-full border border-surface-container-highest bg-surface-container-lowest text-[12px] font-label-bold text-on-surface hover:border-primary-container active:scale-95 transition-all";
                });
                chip.className = "shrink-0 px-4 py-2 rounded-full border border-primary text-primary bg-primary/5 text-[12px] font-label-bold ring-1 ring-primary transition-all";
            });
        });
    </script>
