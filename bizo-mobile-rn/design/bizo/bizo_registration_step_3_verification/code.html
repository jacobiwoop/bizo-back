<style>
        .otp-input:focus {
            outline: none;
            border-color: #5B5BD6;
            border-bottom: 3px solid #f5c518;
            box-shadow: none;
        }
        .otp-input-filled {
            border-color: #f5c518;
        }
        .glass-nav {
            background: rgba(248, 249, 250, 0.8);
            backdrop-filter: blur(12px);
        }

<body class="bg-background text-on-surface font-body-md antialiased min-h-screen flex flex-col">
<!-- [1] TOP NAV + PROGRESS BAR -->
<header class="fixed top-0 w-full z-50 glass-nav">
<div class="h-16 flex items-center justify-between px-container-margin">
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-container-high transition-colors active:scale-95 duration-150">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<span class="font-display text-headline-lg-mobile text-primary tracking-tight">Bizo</span>
<div class="w-10"></div> <!-- Spacer for alignment -->
</div>
<!-- Progress Bar -->
<div class="w-full h-1 bg-surface-container-highest relative">
<div class="h-full bg-primary-container transition-all duration-700 ease-out flex items-center justify-end pr-2" style="width: 100%;">
<span class="material-symbols-outlined text-[12px] text-on-primary-container font-bold" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</div>
</header>
<main class="flex-1 mt-20 px-container-margin pb-32 max-w-md mx-auto w-full flex flex-col">
<!-- [2] ILLUSTRATION -->
<div class="flex justify-center mt-6 mb-8">
<img alt="Vérification par email" class="h-[160px] w-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAjWXanQtOlPRh4mRp3ZWN6R9xDrAkp5esjzRZh-SitqCNds9_c6lc-n8o3chO2MiEPgH1nmrkhOdEX__wFuGIXw5lIvXFLdskvUUZO7QawVeo30mQSTdp8VNF_GA-1B3i2-lu8Hty6Os7xUus2W5BaZNK7a89WSlS83NYI9bMEV0AzFT5NicVVtMeoCjqJ9a8pTjQvLOx_bX776YmoCkp4FbCbQUPH_SKjw9PCjakhlfrD1l2x5KVNK_eMvOBxZ9dqegz8KcTt7Is"/>
</div>
<!-- [3] HEADING -->
<div class="text-center mb-8 space-y-2">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Vérifiez votre email</h1>
<p class="text-secondary font-body-sm">Un code à 6 chiffres a été envoyé à</p>
<div class="flex items-center justify-center gap-2 group cursor-pointer">
<span class="font-label-bold text-body-md text-on-surface">votre@email.com</span>
<span class="material-symbols-outlined text-[18px] text-[#5B5BD6] hover:scale-110 transition-transform">edit</span>
</div>
</div>
<!-- [4] OTP INPUT -->
<div class="flex justify-between gap-2 mb-10" id="otp-container">
<input class="otp-input w-[52px] h-[60px] text-center text-[28px] font-bold border-[#E5E7EB] rounded-xl bg-surface-container-lowest transition-all otp-input-filled" maxlength="1" type="text" value="4"/>
<input class="otp-input w-[52px] h-[60px] text-center text-[28px] font-bold border-[#E5E7EB] rounded-xl bg-surface-container-lowest transition-all otp-input-filled" maxlength="1" type="text" value="8"/>
<input autofocus="" class="otp-input w-[52px] h-[60px] text-center text-[28px] font-bold border-[#E5E7EB] rounded-xl bg-surface-container-lowest transition-all" maxlength="1" type="text"/>
<input class="otp-input w-[52px] h-[60px] text-center text-[28px] font-bold border-[#E5E7EB] rounded-xl bg-surface-container-lowest transition-all" maxlength="1" type="text"/>
<input class="otp-input w-[52px] h-[60px] text-center text-[28px] font-bold border-[#E5E7EB] rounded-xl bg-surface-container-lowest transition-all" maxlength="1" type="text"/>
<input class="otp-input w-[52px] h-[60px] text-center text-[28px] font-bold border-[#E5E7EB] rounded-xl bg-surface-container-lowest transition-all" maxlength="1" type="text"/>
</div>
<!-- [5] RESEND ROW -->
<div class="text-center space-y-3">
<p class="text-secondary font-body-sm">Vous n'avez pas reçu le code ?</p>
<div class="flex items-center justify-center gap-2 text-secondary/70 font-body-sm">
<span class="material-symbols-outlined text-[16px]">schedule</span>
<span>Renvoyer dans <span class="font-bold" id="timer">45</span>s</span>
</div>
</div>
</main>
<!-- [6] BOTTOM STICKY -->
<footer class="fixed bottom-0 left-0 w-full p-container-margin bg-gradient-to-t from-background via-background/90 to-transparent">
<div class="max-w-md mx-auto">
<button class="w-full h-[52px] bg-on-surface text-surface flex items-center justify-center gap-3 rounded-full font-label-bold shadow-lg hover:shadow-xl active:scale-[0.98] transition-all duration-200">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                Vérifier et continuer
            </button>
</div>
</footer>
<script>
        // Simple timer logic
        let timeLeft = 45;
        const timerElement = document.getElementById('timer');
        const interval = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(interval);
                return;
            }
            timeLeft -= 1;
            timerElement.textContent = timeLeft;
        }, 1000);

        // Auto-focus logic for OTP inputs
        const inputs = document.querySelectorAll('.otp-input');
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
                if (e.target.value.length > 0) {
                    input.classList.add('otp-input-filled');
                    input.classList.add('border-primary-container');
                } else {
                    input.classList.remove('otp-input-filled');
                    input.classList.remove('border-primary-container');
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value.length === 0 && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });
    </script>
