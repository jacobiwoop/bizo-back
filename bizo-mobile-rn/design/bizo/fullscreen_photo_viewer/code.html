<!DOCTYPE html>

<html class="h-full" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>Marketplace Fullscreen Viewer</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>

                        "on-secondary-fixed": "#0a006b",
                        "inverse-primary": "#f0c110",
                        "surface-container-high": "#e2e8f8",
                        "on-secondary-fixed-variant": "#3533b0",
                        "on-error-container": "#93000a",
                        "secondary": "#4e4ec9",
                        "on-primary-fixed-variant": "#584400",
                        "on-tertiary": "#ffffff",
                        "surface-container-highest": "#dce2f3",
                        "primary-fixed": "#ffe08b",
                        "on-error": "#ffffff",
                        "tertiary-container": "#cdcaca",
                        "surface-container-low": "#f0f3ff",
                        "surface": "#f9f9ff",
                        "on-tertiary-container": "#565555",
                        "on-secondary-container": "#120094",
                        "outline": "#807660",
                        "on-surface-variant": "#4e4633",
                        "error-container": "#ffdad6",
                        "secondary-container": "#8283ff",
                        "error": "#ba1a1a",
                        "tertiary-fixed": "#e5e2e1",
                        "background": "#f9f9ff",
                        "surface-tint": "#745b00",
                        "on-primary-container": "#695200",
                        "surface-container": "#e7eefe",
                        "outline-variant": "#d1c5ac",
                        "on-primary": "#ffffff",
                        "on-primary-fixed": "#241a00",
                        "tertiary": "#5f5e5e",
                        "on-tertiary-fixed": "#1c1b1b",
                        "surface-bright": "#f9f9ff",
                        "primary-fixed-dim": "#f0c110",
                        "on-background": "#151c27",
                        "tertiary-fixed-dim": "#c8c6c5",
                        "surface-dim": "#d3daea",
                        "primary": "#745b00",
                        "on-surface": "#151c27",
                        "on-tertiary-fixed-variant": "#474746",
                        "surface-variant": "#dce2f3",
                        "surface-container-lowest": "#ffffff",
                        "primary-container": "#f5c518",
                        "inverse-on-surface": "#ebf1ff",
                        "inverse-surface": "#2a313d"

                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"

                    "spacing": {

                        "margin-mobile": "16px",
                        "max-width": "1280px",
                        "gutter": "24px",
                        "margin-desktop": "48px"

                    "fontFamily": {
                        "body-sm": ["Archivo Narrow"],
                        "headline-md": ["Archivo Narrow"],
                        "headline-lg": ["Archivo Narrow"],

                        "body-md": ["16px", {"lineHeight": "1.5", "letterSpacing": "0em", "fontWeight": "400"}],

                        "label-sm": ["12px", {"lineHeight": "1", "letterSpacing": "0.02em", "fontWeight": "500"}],

                },
            },

<style>
        body {
            background-color: #000000;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Archivo Narrow', sans-serif;
            color: #ffffff;
        }
        .safe-top {
            padding-top: env(safe-area-inset-top);
        }
        .safe-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .active-dot {
            background-color: #F5C518;
        }
    </style>
</head>
<body class="flex flex-col h-screen w-full max-w-[390px] mx-auto relative">
<!-- TOP BAR -->
<header class="safe-top fixed top-0 left-0 w-full z-50 bg-transparent flex items-center justify-between px-4 h-16 pointer-events-none">
<div class="pointer-events-auto active:scale-95 transition-transform">
<span class="material-symbols-outlined text-white text-[28px]" data-icon="close">close</span>
</div>
<div class="flex flex-col items-center">
<span class="text-[15px] font-bold leading-tight">Thomas B.</span>
<span class="text-[12px] text-white/60 font-body-sm">10:32</span>
</div>
<div class="flex gap-4 pointer-events-auto">
<button class="active:scale-95 transition-transform">
<span class="material-symbols-outlined text-white text-[24px]" data-icon="download">download</span>
</button>
<button class="active:scale-95 transition-transform">
<span class="material-symbols-outlined text-white text-[24px]" data-icon="share">share</span>
</button>
</div>
</header>
<!-- MAIN CONTENT CANVAS -->
<main class="flex-1 flex flex-col items-center justify-center relative px-2">
<!-- Left Swipe Hint -->
<div class="absolute left-2 top-1/2 -translate-y-1/2 opacity-40">
<span class="material-symbols-outlined text-white text-[32px]" data-icon="chevron_left">chevron_left</span>
</div>
<!-- Image Container -->
<div class="relative w-full max-w-full aspect-[3/4] sm:aspect-square flex items-center justify-center">
<div class="relative group">
<img alt="Leica M3 replica" class="w-full h-auto max-h-[60vh] object-contain rounded-lg border border-white/10 shadow-2xl transition-transform duration-500 hover:scale-[1.02]" src="https://lh3.googleusercontent.com/aida/ADBb0uh87IkLFidw7GYFSqWQWd1E3mP2pJ0uTVj2ZF-WThGORhMIw_Pqf2GfCxK-sA9BRkei2b_rNTxhpG4iAt1u1RwC6Puu8w-f4wL7oLzn6Q9g88N4RWAKA9DGz_GM_SLdUHi8D1PjV1ovLjNeUWg8Tibix_rewC0YavAHvD6so9sjMZZKUquHp6nACfOfBGOURCg0qFJdM8KT4RRmCnDtW1LvYOycmvQ_OJrh0cPfB9gPF15q_cq_pzKhMw"/>
<!-- Zoom Hint -->
<div class="absolute bottom-3 right-3 bg-black/40 backdrop-blur-md rounded-full p-1.5 flex items-center justify-center">
<span class="material-symbols-outlined text-white text-[18px]" data-icon="zoom_in">zoom_in</span>
</div>
</div>
</div>
<!-- Right Swipe Hint -->
<div class="absolute right-2 top-1/2 -translate-y-1/2 opacity-40">
<span class="material-symbols-outlined text-white text-[32px]" data-icon="chevron_right">chevron_right</span>
</div>
<!-- Pagination Dots -->
<div class="mt-8 flex gap-2 items-center">
<div class="w-1.5 h-1.5 rounded-full bg-white/40"></div>
<div class="w-2 h-2 rounded-full active-dot shadow-[0_0_8px_rgba(245,197,24,0.5)]"></div>
<div class="w-1.5 h-1.5 rounded-full bg-white/40"></div>
<div class="w-1.5 h-1.5 rounded-full bg-white/40"></div>
<div class="w-1.5 h-1.5 rounded-full bg-white/40"></div>
</div>
</main>
<!-- BOTTOM BAR -->
<footer class="safe-bottom fixed bottom-0 left-0 w-full z-50 bg-gradient-to-t from-black/90 via-black/40 to-transparent pt-12 pb-6 px-6">
<div class="flex items-center justify-between">
<!-- Left Action -->
<button class="flex items-center gap-2 group">
<span class="material-symbols-outlined text-white text-[24px] group-active:translate-x-[-2px] transition-transform" data-icon="reply">reply</span>
<span class="text-white text-body-md font-medium tracking-wide">Répondre</span>
</button>
<!-- Counter -->
<div class="bg-white/10 backdrop-blur-lg px-4 py-1.5 rounded-full border border-white/10">
<span class="text-[14px] font-bold text-white tracking-widest">2 / 5</span>
</div>
<!-- Right Action -->
<button class="flex items-center gap-2 group">
<span class="text-white text-body-md font-medium tracking-wide">Transférer</span>
<span class="material-symbols-outlined text-white text-[24px] group-active:translate-x-[2px] transition-transform" data-icon="forward">forward</span>
</button>
</div>
</footer>
<!-- INTERACTION SCRIPTS -->
<script>
        // Simple micro-interaction for the close button
        document.querySelector('[data-icon="close"]').parentElement.addEventListener('click', () => {
            document.body.style.opacity = '0';
            document.body.style.transition = 'opacity 0.3s ease-out';
            setTimeout(() => {
                console.log('Close viewer triggered');
            }, 300);
        });

        // Haptic-like feedback on icons
        document.querySelectorAll('.material-symbols-outlined').forEach(icon => {
            icon.addEventListener('touchstart', () => {
                icon.style.opacity = '0.6';
            });
            icon.addEventListener('touchend', () => {
                icon.style.opacity = '1';
            });
        });
    </script>
</body></html>
