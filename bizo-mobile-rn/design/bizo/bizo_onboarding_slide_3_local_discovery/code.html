<html class="light" lang="fr"><head>

      tailwind.config = {

          extend: {
            "colors": {
                    "secondary": "#5f5e5e",

                    "on-tertiary-fixed-variant": "#004e5e",

                    "on-secondary": "#ffffff",
                    "primary-container": "#f5c518",
                    "on-tertiary-fixed": "#001f27",
                    "on-surface-variant": "#4e4633",
                    "inverse-surface": "#2e3132",
                    "primary-fixed": "#ffe08b",
                    "on-surface": "#191c1d",
                    "surface": "#f8f9fa",
                    "inverse-on-surface": "#f0f1f2",
                    "on-primary": "#ffffff",
                    "tertiary": "#00687c",
                    "on-error": "#ffffff",
                    "error-container": "#ffdad6",
                    "secondary-container": "#e2dfde",
                    "on-primary-fixed-variant": "#584400",
                    "error": "#ba1a1a",
                    "on-secondary-fixed": "#1c1b1b",
                    "background": "#f8f9fa",
                    "surface-dim": "#d9dadb",
                    "on-primary-fixed": "#241a00",
                    "on-secondary-fixed-variant": "#474746",
                    "primary": "#745b00",

                    "on-error-container": "#93000a",

            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"

            "spacing": {
                    "gutter": "12px",
                    "base": "8px",
                    "container-margin": "20px",
                    "section-gap": "32px"
            },
            "fontFamily": {
                    "label-bold": ["Inter"],
                    "display": ["Archivo Narrow"],
                    "body-lg": ["Inter"],
                    "headline-md": ["Archivo Narrow"],

            "fontSize": {

                    "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "300"}],
                    "headline-md": ["20px", {"lineHeight": "1.3", "fontWeight": "800"}],
                    "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "300"}],

                    "body-sm": ["14px", {"lineHeight": "1.4", "fontWeight": "400"}],
                    "headline-lg": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "900"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            background: linear-gradient(180deg, #FFFFFF 0%, #EFF6FF 100%);
            height: 100vh;
            overflow: hidden;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .step-dot {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .slide-up {
            animation: slideUp 0.6s ease-out forwards;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center font-body-md text-on-surface">
<!-- Top Navigation (Onboarding Focus: TopAppBar Logic) -->
<header class="fixed top-0 w-full z-50 flex items-center justify-end px-container-margin h-16">
<button class="text-secondary dark:text-secondary-fixed-dim font-label-bold text-label-bold py-2 px-4 hover:bg-surface-container-high transition-colors active:scale-95 duration-150">
            Passer
        </button>
</header>
<!-- Content Canvas -->
<main class="relative w-full h-full max-w-[390px] mx-auto flex flex-col shadow-2xl bg-transparent overflow-hidden">
<!-- Illustration Zone (420px height) -->
<div class="h-[420px] w-full flex items-center justify-center p-8">
<div class="relative w-full h-full flex items-center justify-center">
<!-- Generated Map Illustration from context -->
<img alt="Illustration of a minimalist map with location markers" class="w-full h-full object-contain transform scale-110" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD4XoSeh6Cg5Qcr7Ax9Ey8412_STDRifVmIOjowAb4m208RJgflBTQoUK-UbkMg6yy203NuTO6DGg4BkFHe2K1iFSDvs6EY8OGpmFpg3jdtx6TSoOww9OrVKBqjW7UzhiLouI2_zd-vB9NtX40GXfRqBqviBR36Bf2serliH11qY1xA3I1PYBqJ4cmyjj1l4zmx6JywHfLjgKoizXhE5VsFf9FwMb04lfAWJjk2TsDSuoiYxBdy3VDaT6jXUX3nSdqiN2NfXrHJ3b4"/>
</div>
</div>
<!-- Bottom Content Area -->
<div class="flex-grow bg-surface-container-lowest rounded-t-[24px] p-8 flex flex-col justify-between slide-up shadow-[0_-10px_40px_rgba(0,0,0,0.05)]">
<div class="flex flex-col">
<!-- Slide Indicator -->
<div class="flex gap-2 mb-8">
<div class="step-dot h-1.5 w-1.5 rounded-full bg-secondary-fixed"></div>
<div class="step-dot h-1.5 w-1.5 rounded-full bg-secondary-fixed"></div>
<div class="step-dot h-1.5 w-6 rounded-full bg-primary-container"></div>
<div class="step-dot h-1.5 w-1.5 rounded-full bg-secondary-fixed"></div>
</div>
<!-- Typography Anchor -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface leading-tight">
                    Près de<br/>chez vous
                </h1>
<p class="mt-3 text-secondary font-body-md text-[15px] leading-relaxed">
                    Trouvez des annonces dans votre quartier. Rencontrez des vendeurs à proximité.
                </p>
</div>
<!-- Action Area -->
<div class="mt-auto pt-8">
<button class="w-full h-[52px] bg-inverse-surface text-inverse-on-surface rounded-full flex items-center justify-center gap-2 hover:opacity-90 active:scale-95 transition-all duration-200 shadow-lg">
<span class="font-label-bold text-label-bold text-[16px]">Suivant</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</div>
</main>
<!-- Micro-interaction Script -->
<script>
        document.querySelector('button').addEventListener('click', () => {
            // Haptic-like effect simulation
            if (window.navigator.vibrate) {
                window.navigator.vibrate(10);
            }
        });
    </script>
</body></html>
