<!DOCTYPE html>

<html class="light" lang="fr"><head>

                    "surface-dim": "#d9dadb",
                    "surface-container-high": "#e7e8e9",
                    "error-container": "#ffdad6",
                    "secondary-container": "#e2dfde",
                    "error": "#ba1a1a",
                    "on-tertiary-fixed": "#001f27",
                    "on-error": "#ffffff",
                    "surface-container-low": "#f3f4f5",
                    "primary-fixed-dim": "#f0c110",

                    "on-secondary-fixed-variant": "#474746",

                    "on-primary-fixed-variant": "#584400",

            "borderRadius": {
                    "DEFAULT": "0.25rem",

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .fill-icon {
            font-variation-settings: 'FILL' 1;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Soft Depth Shadows */
        .shadow-soft {
            box-shadow: 0 4px 20px 0 rgba(0, 0, 0, 0.04);
        }
        .shadow-floating {
            box-shadow: 0 8px 24px 0 rgba(0, 0, 0, 0.08);
        }
        .progress-bar-fill {
            transition: width 0.6s cubic-bezier(0.65, 0, 0.35, 1);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col items-center">
<!-- Top Navigation (Shell Implementation) -->
<header class="w-full top-0 sticky bg-surface z-50">
<div class="flex justify-between items-center px-container-margin py-4 w-full max-w-[1200px] mx-auto">
<button class="transition-opacity duration-200 hover:opacity-80">
<span class="material-symbols-outlined text-on-surface">close</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary">Publier une annonce</h1>
<button class="font-label-bold text-label-bold text-secondary uppercase tracking-wider">Brouillon</button>
</div>
<!-- Progress Bar -->
<div class="w-full h-1 bg-surface-container-highest">
<div class="h-full bg-primary-container progress-bar-fill" style="width: 71%;"></div>
</div>
</header>
<main class="w-full max-w-[1200px] flex-1 px-container-margin pt-8 pb-32">
<!-- Heading -->
<section class="mb-section-gap">
<h2 class="font-headline-lg text-headline-lg text-on-surface">Quel est votre prix ?</h2>
</section>
<!-- Price Input Section -->
<section class="mb-section-gap">
<div class="w-full flex items-center justify-center bg-surface-container-lowest rounded-[24px] border border-surface-container-highest p-8 transition-all duration-300 focus-within:border-primary-container focus-within:shadow-soft group">
<div class="flex items-baseline gap-2">
<span class="font-headline-lg text-[32px] text-on-surface">€</span>
<input class="w-32 bg-transparent border-none p-0 focus:ring-0 font-headline-lg text-[48px] text-on-surface placeholder-surface-container-highest text-center appearance-none" placeholder="0" type="number"/>
</div>
</div>
<!-- Focus Indication Underline (Visual Only) -->
<div class="w-24 h-1 bg-primary-container mx-auto -mt-1 rounded-full opacity-0 transition-opacity duration-300 peer-focus:opacity-100"></div>
</section>
<!-- Price Options (Stacked Cards) -->
<section class="space-y-4 mb-section-gap">
<!-- Option 1 -->
<label class="relative flex items-center p-4 bg-surface-container-lowest rounded-xl shadow-soft cursor-pointer hover:bg-surface-container-low transition-colors duration-200">
<div class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container text-on-surface-variant mr-4">
<span class="material-symbols-outlined">sell</span>
</div>
<div class="flex-1">
<p class="font-headline-md text-headline-md text-on-surface">Prix fixe</p>
<p class="font-body-sm text-body-sm text-secondary">Pas de négociation</p>
</div>
<input class="w-6 h-6 text-on-surface border-surface-container-highest focus:ring-transparent focus:ring-offset-0" name="price_type" type="radio"/>
</label>
<!-- Option 2 (Selected State) -->
<label class="relative flex items-center p-4 bg-surface-container-lowest border-2 border-on-surface rounded-xl shadow-soft cursor-pointer transition-colors duration-200">
<div class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container text-on-surface-variant mr-4">
<span class="material-symbols-outlined">forum</span>
</div>
<div class="flex-1">
<p class="font-headline-md text-headline-md text-on-surface">Prix négociable</p>
<p class="font-body-sm text-body-sm text-secondary">Possibilité de discuter le prix</p>
</div>
<div class="w-6 h-6 rounded-full border-[6px] border-on-surface bg-background"></div>
<input checked="" class="hidden" name="price_type" type="radio"/>
</label>
<!-- Option 3 -->
<label class="relative flex items-center p-4 bg-surface-container-lowest rounded-xl shadow-soft cursor-pointer hover:bg-surface-container-low transition-colors duration-200">
<div class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container text-on-surface-variant mr-4">
<span class="material-symbols-outlined">redeem</span>
</div>
<div class="flex-1">
<p class="font-headline-md text-headline-md text-on-surface">Dons / Gratuit</p>
</div>
<input class="w-6 h-6 text-on-surface border-surface-container-highest focus:ring-transparent focus:ring-offset-0" name="price_type" type="radio"/>
</label>
</section>
<!-- Promotional Boost Card -->
<section class="mb-10">
<div class="rounded-xl overflow-hidden shadow-soft relative">
<!-- Atmospheric Background Gradient -->
<div class="absolute inset-0 bg-gradient-to-br from-tertiary-fixed-dim/20 to-tertiary-fixed/10"></div>
<div class="relative p-5 flex items-center justify-between">
<div class="flex items-center gap-4">
<div class="w-12 h-12 flex items-center justify-center rounded-full bg-primary-container text-on-primary-container shadow-sm">
<span class="material-symbols-outlined fill-icon" style="font-variation-settings: 'FILL' 1;">star</span>
</div>
<div>
<p class="font-headline-md text-[15px] leading-tight text-on-surface">Boostez votre annonce</p>
<p class="font-body-sm text-[13px] text-secondary">Soyez vu 5x plus. À partir de 1,99€</p>
</div>
</div>
<span class="material-symbols-outlined text-tertiary">chevron_right</span>
</div>
</div>
</section>
</main>
<!-- Bottom Sticky Action (Suppresses standard Nav) -->
<footer class="fixed bottom-0 left-0 w-full bg-surface/80 backdrop-blur-xl px-container-margin py-6 pb-8 z-50">
<button class="w-full bg-on-secondary-fixed text-on-secondary py-4 px-8 rounded-full font-headline-md flex items-center justify-center gap-3 shadow-floating transition-transform duration-150 active:scale-95">
            Continuer
            <span class="material-symbols-outlined">arrow_forward</span>
</button>
</footer>
<!-- Micro-interaction for input focus -->
<script>
        const priceInput = document.querySelector('input[type="number"]');
        const container = priceInput.closest('div.group');
        
        priceInput.addEventListener('focus', () => {
            container.classList.add('border-primary-container');
        });
        
        priceInput.addEventListener('blur', () => {
            container.classList.remove('border-primary-container');
        });

        // Simple Radio selection styling logic
        const labels = document.querySelectorAll('label');
        labels.forEach(label => {
            label.addEventListener('click', () => {
                labels.forEach(l => {
                    l.classList.remove('border-2', 'border-on-surface');
                    const radioCheck = l.querySelector('div.rounded-full.border-\\[6px\\]');
                    if(radioCheck) {
                        radioCheck.className = 'w-6 h-6 rounded-full border-surface-container-highest border-2';
                    }
                });
                label.classList.add('border-2', 'border-on-surface');
                // Note: Simplified logic for visualization
            });
        });
    </script>
</body></html>
