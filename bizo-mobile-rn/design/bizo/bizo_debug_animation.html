<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bizo — Debug</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f5f4ef;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: sans-serif;
    gap: 20px;
  }

  /* ── GRILLE ── */
  #grid-overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 100;
    display: none;
  }
  #grid-overlay.visible { display: block; }
  /* lignes légères tous les 50px */
  #grid-overlay::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      repeating-linear-gradient(to right,  rgba(0,0,200,.08) 0px, rgba(0,0,200,.08) 1px, transparent 1px, transparent 50px),
      repeating-linear-gradient(to bottom, rgba(0,0,200,.08) 0px, rgba(0,0,200,.08) 1px, transparent 1px, transparent 50px);
  }
  /* croix centrale bold */
  #grid-overlay::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(to right,  transparent calc(50% - 1.5px), rgba(220,40,40,.85) calc(50% - 1.5px), rgba(220,40,40,.85) calc(50% + 1.5px), transparent calc(50% + 1.5px)),
      linear-gradient(to bottom, transparent calc(50% - 1.5px), rgba(220,40,40,.85) calc(50% - 1.5px), rgba(220,40,40,.85) calc(50% + 1.5px), transparent calc(50% + 1.5px));
  }

  #stage {
    position: relative;
    width: 520px;
    height: 220px;
    overflow: visible;
  }

  #logo-wrap {
    position: absolute;
    top: 50%;
    left: 50%;
    --offset-x: 0px;
    --offset-y: 0px;
    transform: translate(calc(-50% + var(--offset-x)), calc(-50% + var(--offset-y)));
    width: 420px;
    height: 160px;
    cursor: grab;
    touch-action: none;
    user-select: none;
  }

  #logo-wrap.dragging { cursor: grabbing; }

  #logo-wrap svg {
    display: block;
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  @keyframes tagBounce {
    0%, 100% { transform: translateY(0px);   }
    50%       { transform: translateY(-12px); }
  }

  /* ── CONTROLS ── */
  #controls {
    display: flex;
    align-items: center;
    gap: 16px;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 10px 18px;
    font-size: 13px;
    color: #444;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
  }

  #controls button {
    background: #2f2e2e;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 6px 14px;
    font-size: 13px;
    cursor: pointer;
    transition: background .15s;
  }
  #controls button:hover { background: #555; }
  #controls button.active { background: #e8b521; color: #2f2e2e; }

  .sep { width: 1px; height: 22px; background: #ddd; }

  .speed-group { display: flex; align-items: center; gap: 8px; }
  .speed-group label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
  .speed-group input[type=radio] { accent-color: #e8b521; }

  .offset-group { display: flex; align-items: center; gap: 8px; }
  .offset-group label { display: flex; align-items: center; gap: 4px; }
  .offset-group input {
    width: 66px;
    border: 1px solid #ddd;
    border-radius: 7px;
    padding: 5px 6px;
    font-size: 12px;
  }

  #left-readout {
    font-size: 11px;
    color: #999;
    font-variant-numeric: tabular-nums;
    min-width: 80px;
  }
</style>
</head>
<body>

</div>

<!-- CONTROLS -->
<div id="controls">
  <button id="btn-play">▶ Rejouer</button>
  <button id="btn-pause">⏸ Pause</button>
  <div class="sep"></div>
  <div class="speed-group">
    <span>Vitesse :</span>
    <label><input type="radio" name="speed" value="0.25"> 0.25×</label>
    <label><input type="radio" name="speed" value="0.5">  0.5×</label>
    <label><input type="radio" name="speed" value="1" checked> 1×</label>
    <label><input type="radio" name="speed" value="2">  2×</label>
  </div>
  <div class="sep"></div>
  <button id="btn-grid">⊞ Grille</button>
  <div class="sep"></div>
  <div class="offset-group">
    <span>Offset :</span>
    <label>X <input id="offset-x" type="number" value="0" step="1"></label>
    <label>Y <input id="offset-y" type="number" value="0" step="1"></label>
    <span>ou glisser le logo</span>
  </div>
  <div class="sep"></div>
  <span id="left-readout">left: 76.0%</span>
</div>

<script>
  // ── état global ──
  let paused = false;
  let speedMult = 1;
  let animRunning = false;
  let rafIds = [];          // tous les rAF en cours
  let timeoutIds = [];      // tous les setTimeout en cours
  const START_PCT = 70;
  const END_PCT = 50;

  // ── helpers ──
  function easeOutBack(t) {
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  }
  function easeOut(t) { return 1 - Math.pow(1 - t, 3); }

  // rAF pausable
  function praf(fn) {
    let id;
    function tick(now) {
      if (!paused) fn(now);
      id = requestAnimationFrame(tick);
      rafIds.push(id);
    }
    id = requestAnimationFrame(tick);
    rafIds.push(id);
    return () => cancelAnimationFrame(id);
  }

  function animEl(el, baseDuration) {
    const duration = baseDuration / speedMult;
    return new Promise(resolve => {
      el.style.opacity = '0';
      let startTime = null;
      let pausedAt = null;
      let elapsed = 0;

      function frame(now) {
        if (paused) {
          pausedAt = now;
          requestAnimationFrame(frame);
          return;
        }
        if (pausedAt !== null) {
          startTime += (now - pausedAt);
          pausedAt = null;
        }
        if (startTime === null) startTime = now;
        const t = Math.min((now - startTime) / duration, 1);
        const e = easeOutBack(t);
        el.style.opacity = String(Math.min(t * 2, 1));
        el.style.transform = `scale(${e})`;
        if (t < 1) requestAnimationFrame(frame);
        else { el.style.opacity = '1'; el.style.transform = 'scale(1)'; resolve(); }
      }
      requestAnimationFrame(frame);
    });
  }

  const wrap = document.getElementById('logo-wrap');
  const readout = document.getElementById('left-readout');
  const offsetXInput = document.getElementById('offset-x');
  const offsetYInput = document.getElementById('offset-y');

  function applyOffset() {
    wrap.style.setProperty('--offset-x', `${Number(offsetXInput.value || 0)}px`);
    wrap.style.setProperty('--offset-y', `${Number(offsetYInput.value || 0)}px`);
  }

  let dragState = null;

  function setOffset(x, y) {
    offsetXInput.value = String(Math.round(x));
    offsetYInput.value = String(Math.round(y));
    applyOffset();
  }

  wrap.addEventListener('pointerdown', event => {
    event.preventDefault();
    wrap.setPointerCapture(event.pointerId);
    wrap.classList.add('dragging');
    dragState = {
      pointerId: event.pointerId,
      startX: event.clientX,
      startY: event.clientY,
      originX: Number(offsetXInput.value || 0),
      originY: Number(offsetYInput.value || 0),
    };
  });

  wrap.addEventListener('pointermove', event => {
    if (!dragState || dragState.pointerId !== event.pointerId) return;
    setOffset(
      dragState.originX + event.clientX - dragState.startX,
      dragState.originY + event.clientY - dragState.startY
    );
  });

  function endDrag(event) {
    if (!dragState || dragState.pointerId !== event.pointerId) return;
    wrap.classList.remove('dragging');
    dragState = null;
  }

  wrap.addEventListener('pointerup', endDrag);
  wrap.addEventListener('pointercancel', endDrag);

  function slideWrap(startPct, endPct, baseDuration) {
    const duration = baseDuration / speedMult;
    let startTime = null;
    let pausedAt = null;

    return new Promise(resolve => {
      function frame(now) {
        if (paused) {
          pausedAt = now;
          requestAnimationFrame(frame);
          return;
        }
        if (pausedAt !== null) {
          startTime += (now - pausedAt);
          pausedAt = null;
        }
        if (startTime === null) startTime = now;
        const t = Math.min((now - startTime) / duration, 1);
        const e = easeOut(t);
        const pct = startPct + (endPct - startPct) * e;
        wrap.style.left = pct + '%';
        readout.textContent = `left: ${pct.toFixed(1)}%`;
        if (t < 1) requestAnimationFrame(frame);
        else { wrap.style.left = endPct + '%'; readout.textContent = `left: ${endPct.toFixed(1)}%`; resolve(); }
      }
      requestAnimationFrame(frame);
    });
  }

  function delay(ms) {
    return new Promise(resolve => {
      const id = setTimeout(resolve, ms / speedMult);
      timeoutIds.push(id);
    });
  }

  function cancelAll() {
    timeoutIds.forEach(clearTimeout);
    timeoutIds = [];
  }

  async function runAnim() {
    if (animRunning) cancelAll();
    animRunning = true;
    paused = false;
    document.getElementById('btn-pause').textContent = '⏸ Pause';
    document.getElementById('btn-pause').classList.remove('active');

    const ids = ['g-b','g-tag','g-i','g-z','g-o'];
    ids.forEach(id => {
      const el = document.getElementById(id);
      el.style.opacity = '0';
      el.style.transform = 'scale(0)';
      el.style.animation = 'none';
    });
    wrap.style.left = `${START_PCT}%`;
    readout.textContent = `left: ${START_PCT.toFixed(1)}%`;

    await delay(300);

    await animEl(document.getElementById('g-b'), 500);
    await delay(200);

    await animEl(document.getElementById('g-tag'), 400);
    await delay(300);

    const slidePromise = slideWrap(START_PCT, END_PCT, 700);
    setTimeout(() => animEl(document.getElementById('g-i'), 380), 150  / speedMult);
    setTimeout(() => animEl(document.getElementById('g-z'), 380), 340  / speedMult);
    setTimeout(() => animEl(document.getElementById('g-o'), 380), 530  / speedMult);
    await slidePromise;

    await delay(300);

    const tag = document.getElementById('g-tag');
    tag.style.animation = 'tagBounce 1.1s ease-in-out infinite';
    animRunning = false;
  }

  // ── boutons ──
  document.getElementById('btn-play').addEventListener('click', runAnim);

  document.getElementById('btn-pause').addEventListener('click', () => {
    paused = !paused;
    const btn = document.getElementById('btn-pause');
    btn.textContent = paused ? '▶ Reprendre' : '⏸ Pause';
    btn.classList.toggle('active', paused);
  });

  document.querySelectorAll('input[name=speed]').forEach(r => {
    r.addEventListener('change', e => { speedMult = parseFloat(e.target.value); });
  });

  document.getElementById('btn-grid').addEventListener('click', () => {
    document.getElementById('grid-overlay').classList.toggle('visible');
  });

  offsetXInput.addEventListener('input', applyOffset);
  offsetYInput.addEventListener('input', applyOffset);
  applyOffset();

  runAnim();
</script>
</body>
</html>
