<!DOCTYPE html>

<html class="light" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@800;900&amp;family=Inter:wght@300;400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-container-high": "#e7e8e9",
                    "secondary-container": "#e2dfde",
                    "on-secondary-fixed": "#1c1b1b",
                    "tertiary-fixed-dim": "#42d7fb",
                    "background": "#f8f9fa",
                    "on-primary-fixed-variant": "#584400",
                    "primary-fixed": "#ffe08b",
                    "primary-fixed-dim": "#f0c110",
                    "on-primary-container": "#695200",
                    "tertiary-container": "#49dbff",
                    "secondary-fixed": "#e5e2e1",
                    "inverse-surface": "#2e3132",
                    "on-primary-fixed": "#241a00",
                    "surface-container-highest": "#e1e3e4",
                    "error": "#ba1a1a",
                    "tertiary": "#00687c",
                    "primary": "#745b00",
                    "on-tertiary": "#ffffff",
                    "outline": "#807660",
                    "error-container": "#ffdad6",
                    "primary-container": "#f5c518",
                    "on-secondary-container": "#636262",
                    "on-surface": "#191c1d",
                    "on-tertiary-fixed": "#001f27",
                    "on-tertiary-container": "#005e70",
                    "surface-variant": "#e1e3e4",
                    "inverse-on-surface": "#f0f1f2",
                    "surface-container": "#edeeef",
                    "on-error": "#ffffff",
                    "surface-dim": "#d9dadb",
                    "surface-container-low": "#f3f4f5",
                    "surface-container-lowest": "#ffffff",
                    "surface-tint": "#745b00",
                    "surface-bright": "#f8f9fa",
                    "surface": "#f8f9fa",
                    "on-tertiary-fixed-variant": "#004e5e",
                    "on-surface-variant": "#4e4633",
                    "on-secondary": "#ffffff",
                    "outline-variant": "#d1c5ac",
                    "on-background": "#191c1d",
                    "secondary": "#5f5e5e",
                    "on-error-container": "#93000a",
                    "secondary-fixed-dim": "#c8c6c5",
                    "inverse-primary": "#f0c110",
                    "tertiary-fixed": "#b0ecff",
                    "on-secondary-fixed-variant": "#474746",
                    "on-primary": "#ffffff"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "container-margin": "20px",
                    "base": "8px",
                    "section-gap": "32px",
                    "gutter": "12px"
            },
            "fontFamily": {
                    "body-lg": ["Inter"],
                    "headline-lg-mobile": ["Archivo Narrow"],
                    "display": ["Archivo Narrow"],
                    "label-bold": ["Inter"],
                    "body-sm": ["Inter"],
                    "headline-lg": ["Archivo Narrow"],
                    "headline-md": ["Archivo Narrow"],
                    "body-md": ["Inter"]
            },
            "fontSize": {
                    "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "300"}],
                    "headline-lg-mobile": ["24px", {"lineHeight": "1.2", "fontWeight": "900"}],
                    "display": ["40px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "900"}],
                    "label-bold": ["12px", {"lineHeight": "1", "fontWeight": "700"}],
                    "body-sm": ["14px", {"lineHeight": "1.4", "fontWeight": "400"}],
                    "headline-lg": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "900"}],
                    "headline-md": ["20px", {"lineHeight": "1.3", "fontWeight": "800"}],
                    "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "300"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }
        .progress-track { background-color: #E5E7EB; }
        .progress-fill { background-color: #F5C518; width: 33.33%; }
        .input-focus-effect:focus-within { border-color: #F5C518; box-shadow: 0 0 0 1px #F5C518; }
        ::-webkit-scrollbar { display: none; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body-md min-h-screen flex flex-col">
<!-- Top Navigation -->
<header class="bg-background dark:bg-background w-full top-0 sticky flex items-center justify-between px-container-margin h-16 z-50">
<button class="text-primary dark:text-primary-fixed hover:opacity-80 transition-opacity active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<div class="flex items-center">
<span class="font-headline-md text-headline-md font-black text-on-surface dark:text-on-surface">bizo</span>
<div class="w-2 h-2 rounded-full bg-primary-container ml-0.5"></div>
</div>
<div class="w-6"></div> <!-- Spacer for centering logo -->
</header>
<!-- Progress Section -->
<section class="w-full">
<div class="w-full h-1 progress-track overflow-hidden">
<div class="h-full progress-fill transition-all duration-500 ease-out"></div>
</div>
<div class="px-container-margin pt-2 text-right">
<span class="font-label-bold text-label-bold text-secondary">Étape 1 sur 3</span>
</div>
</section>
<!-- Content Canvas -->
<main class="flex-1 px-container-margin py-6">
<!-- Heading -->
<div class="mb-section-gap">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-1">Créez votre compte</h1>
<p class="font-body-sm text-body-sm text-secondary">Quelques infos pour commencer.</p>
</div>
<div class="space-y-6">
<!-- Avatar Upload -->
<div class="flex flex-col items-center">
<div class="relative group cursor-pointer active:scale-95 transition-transform">
<div class="w-20 h-20 rounded-full border-2 border-dashed border-outline-variant flex items-center justify-center bg-surface-container-low hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-secondary text-3xl" data-icon="photo_camera">photo_camera</span>
<div class="absolute bottom-0 right-0 bg-on-primary-fixed text-white w-6 h-6 rounded-full flex items-center justify-center border-2 border-white">
<span class="material-symbols-outlined text-sm" data-icon="add">add</span>
</div>
</div>
</div>
<label class="mt-3 font-label-bold text-label-bold text-secondary">Photo (optionnel)</label>
</div>
<!-- Form Fields -->
<div class="grid grid-cols-1 gap-5">
<!-- Prénom -->
<div class="space-y-1.5">
<label class="font-label-bold text-[13px] text-on-surface pl-1">Prénom</label>
<div class="relative flex items-center input-focus-effect border border-outline-variant rounded-xl bg-white h-[52px] transition-all">
<span class="material-symbols-outlined absolute left-4 text-secondary" data-icon="person">person</span>
<input class="w-full h-full pl-12 pr-4 bg-transparent border-none focus:ring-0 text-body-md placeholder:text-secondary-container/80 placeholder:font-light" placeholder="Votre prénom" type="text"/>
</div>
</div>
<!-- Nom -->
<div class="space-y-1.5">
<label class="font-label-bold text-[13px] text-on-surface pl-1">Nom</label>
<div class="relative flex items-center input-focus-effect border border-outline-variant rounded-xl bg-white h-[52px] transition-all">
<span class="material-symbols-outlined absolute left-4 text-secondary" data-icon="person">person</span>
<input class="w-full h-full pl-12 pr-4 bg-transparent border-none focus:ring-0 text-body-md placeholder:text-secondary-container/80 placeholder:font-light" placeholder="Votre nom" type="text"/>
</div>
</div>
<!-- Email -->
<div class="space-y-1.5">
<label class="font-label-bold text-[13px] text-on-surface pl-1">Email</label>
<div class="relative flex items-center input-focus-effect border border-outline-variant rounded-xl bg-white h-[52px] transition-all">
<span class="material-symbols-outlined absolute left-4 text-secondary" data-icon="mail">mail</span>
<input class="w-full h-full pl-12 pr-12 bg-transparent border-none focus:ring-0 text-body-md placeholder:text-secondary-container/80 placeholder:font-light" placeholder="votre@email.com" type="email"/>
<span class="material-symbols-outlined absolute right-4 text-tertiary" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
<!-- Téléphone -->
<div class="space-y-1.5">
<label class="font-label-bold text-[13px] text-on-surface pl-1">Téléphone</label>
<div class="flex gap-2 h-[52px]">
<div class="flex items-center justify-center px-4 bg-on-surface text-white font-label-bold rounded-xl active:scale-95 transition-transform cursor-pointer">
                            +225
                        </div>
<div class="flex-1 relative flex items-center input-focus-effect border border-outline-variant rounded-xl bg-white transition-all">
<span class="material-symbols-outlined absolute left-4 text-secondary" data-icon="phone">phone</span>
<input class="w-full h-full pl-12 pr-4 bg-transparent border-none focus:ring-0 text-body-md placeholder:text-secondary-container/80 placeholder:font-light" placeholder="XX XX XX XX XX" type="tel"/>
</div>
</div>
</div>
</div>
</div>
<!-- Bottom spacing for sticky nav -->
<div class="h-32"></div>
</main>
<!-- Bottom Sticky CTA -->
<footer class="fixed bottom-0 left-0 w-full px-container-margin pb-safe flex justify-center items-center h-24 bg-surface/80 backdrop-blur-md shadow-[0_-8px_24px_rgba(0,0,0,0.08)] rounded-t-xl z-50">
<button class="w-full h-[52px] bg-on-surface text-white rounded-full flex items-center justify-center font-label-bold text-body-md hover:bg-on-surface-variant active:scale-[0.98] transition-all duration-200">
<span>Continuer</span>
<span class="material-symbols-outlined ml-2 text-xl" data-icon="arrow_forward">arrow_forward</span>
</button>
</footer>
<script>
        // Simple logic to add input interactions
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('shadow-lg', 'shadow-primary-container/10');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('shadow-lg', 'shadow-primary-container/10');
            });
        });
    </script>
</body></html>
