<!DOCTYPE html>

<html class="light" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;700;800;900&amp;family=Inter:wght@300;400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "tertiary": "#00687c",
                    "surface-tint": "#745b00",
                    "error-container": "#ffdad6",
                    "on-error-container": "#93000a",
                    "on-tertiary": "#ffffff",
                    "on-background": "#191c1d",
                    "primary": "#745b00",
                    "on-surface": "#191c1d",
                    "inverse-surface": "#2e3132",
                    "surface-container-high": "#e7e8e9",
                    "tertiary-fixed-dim": "#42d7fb",
                    "on-error": "#ffffff",
                    "surface-container": "#edeeef",
                    "on-secondary-container": "#636262",
                    "secondary-fixed-dim": "#c8c6c5",
                    "surface-variant": "#e1e3e4",
                    "on-primary-container": "#695200",
                    "outline": "#807660",
                    "background": "#f8f9fa",
                    "secondary": "#5f5e5e",
                    "primary-container": "#f5c518",
                    "on-secondary": "#ffffff",
                    "on-surface-variant": "#4e4633",
                    "on-primary-fixed-variant": "#584400",
                    "on-secondary-fixed-variant": "#474746",
                    "tertiary-container": "#49dbff",
                    "surface-bright": "#f8f9fa",
                    "on-tertiary-fixed-variant": "#004e5e",
                    "on-primary": "#ffffff",
                    "inverse-primary": "#f0c110",
                    "surface": "#f8f9fa",
                    "secondary-container": "#e2dfde",
                    "on-tertiary-container": "#005e70",
                    "on-primary-fixed": "#241a00",
                    "tertiary-fixed": "#b0ecff",
                    "surface-container-lowest": "#ffffff",
                    "primary-fixed": "#ffe08b",
                    "on-secondary-fixed": "#1c1b1b",
                    "on-tertiary-fixed": "#001f27",
                    "surface-container-low": "#f3f4f5",
                    "outline-variant": "#d1c5ac",
                    "surface-dim": "#d9dadb",
                    "error": "#ba1a1a",
                    "secondary-fixed": "#e5e2e1",
                    "primary-fixed-dim": "#f0c110",
                    "surface-container-highest": "#e1e3e4",
                    "inverse-on-surface": "#f0f1f2",
                    "accent-violet": "#5B5BD6"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "2xl": "12px",
                    "3xl": "16px",
                    "full": "9999px"
            },
            "spacing": {
                    "section-gap": "32px",
                    "container-margin": "20px",
                    "gutter": "12px",
                    "base": "8px"
            },
            "fontFamily": {
                    "headline-md": ["Archivo Narrow"],
                    "label-bold": ["Inter"],
                    "headline-lg": ["Archivo Narrow"],
                    "display": ["Archivo Narrow"],
                    "body-md": ["Inter"],
                    "headline-lg-mobile": ["Archivo Narrow"],
                    "body-lg": ["Inter"],
                    "body-sm": ["Inter"]
            },
            "fontSize": {
                    "headline-md": ["20px", {"lineHeight": "1.3", "fontWeight": "800"}],
                    "label-bold": ["12px", {"lineHeight": "1", "fontWeight": "700"}],
                    "headline-lg": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "900"}],
                    "display": ["40px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "900"}],
                    "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "300"}],
                    "headline-lg-mobile": ["24px", {"lineHeight": "1.2", "fontWeight": "900"}],
                    "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "300"}],
                    "body-sm": ["14px", {"lineHeight": "1.4", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        .fill-icon {
            font-variation-settings: 'FILL' 1;
        }
        body {
            background-color: #f8f9fa;
            -webkit-tap-highlight-color: transparent;
        }
        .ios-shadow {
            box-shadow: 0 4px 20px 0 rgba(0, 0, 0, 0.04);
        }
        .ios-shadow-deep {
            box-shadow: 0 8px 24px 0 rgba(0, 0, 0, 0.08);
        }
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex items-center justify-center min-h-screen">
<!-- Mobile Shell (iOS Dimensions) -->
<main class="w-[390px] h-[844px] bg-surface relative flex flex-col overflow-hidden">
<!-- [1] TOP NAV + PROGRESS BAR -->
<header class="w-full bg-white z-50">
<div class="flex items-center justify-between px-4 py-4">
<button class="p-1 hover:opacity-70 transition-opacity">
<span class="material-symbols-outlined text-on-surface">close</span>
</button>
<h1 class="font-headline-lg-mobile text-[16px] text-on-surface font-extrabold uppercase tracking-tight">Publier une annonce</h1>
<button class="text-secondary font-label-bold text-body-sm hover:text-on-surface transition-colors">Brouillon</button>
</div>
<!-- Progress Bar Area -->
<div class="w-full h-1.5 bg-surface-container">
<div class="h-full bg-primary-container w-[85%] transition-all duration-500 ease-out"></div>
</div>
</header>
<!-- Scrollable Content -->
<section class="flex-1 overflow-y-auto px-4 pt-8 pb-32 scrollbar-hide">
<!-- [2] HEADING -->
<div class="mb-8">
<h2 class="font-headline-lg-mobile text-[22px] text-on-surface font-black leading-tight mb-2">Où se trouve votre article?</h2>
<p class="font-body-sm text-secondary">Votre adresse exacte ne sera jamais affichée.</p>
</div>
<!-- [3] LOCATION INPUT & DROPDOWN -->
<div class="relative mb-8">
<label class="block font-label-bold text-[13px] text-on-surface mb-2">Ville ou code postal</label>
<div class="relative flex items-center">
<div class="absolute left-4">
<span class="material-symbols-outlined text-accent-violet">location_on</span>
</div>
<input class="w-full h-12 pl-12 pr-12 rounded-2xl border border-secondary-container bg-white focus:outline-none focus:border-primary-container font-body-md text-on-surface placeholder:text-secondary/50 transition-all shadow-sm" placeholder="Ex: Paris, 75001" type="text"/>
<button class="absolute right-4 p-1 hover:bg-surface-container rounded-full transition-colors">
<span class="material-symbols-outlined text-secondary text-[20px]">my_location</span>
</button>
</div>
<!-- Suggestions Dropdown -->
<div class="absolute top-[calc(100%+8px)] left-0 w-full bg-white rounded-2xl ios-shadow-deep overflow-hidden z-40 border border-secondary-container/30">
<div class="flex items-center px-4 py-3 border-l-4 border-primary-container bg-surface-container-low cursor-pointer">
<span class="material-symbols-outlined text-secondary text-[18px] mr-3">location_on</span>
<span class="font-label-bold text-on-surface text-[14px]">Paris 75001</span>
</div>
<div class="flex items-center px-4 py-3 border-l-4 border-transparent hover:bg-surface-container-low cursor-pointer transition-colors">
<span class="material-symbols-outlined text-secondary text-[18px] mr-3">location_on</span>
<span class="font-body-md text-on-surface text-[14px]">Paris 75002</span>
</div>
</div>
</div>
<!-- [4] MAP PREVIEW -->
<div class="relative w-full h-[200px] rounded-3xl overflow-hidden mb-8 ios-shadow border border-secondary-container/20 group">
<img class="w-full h-full object-cover grayscale opacity-80 group-hover:opacity-100 transition-opacity duration-700" data-alt="A clean, minimalist light-mode map illustration showing the city streets of Paris in soft grays and off-whites. The visual style is premium and airy, matching a modern marketplace app aesthetic. A central golden yellow pinpoint marker sits at the heart of the map, surrounded by a soft, translucent golden yellow circular pulse indicating a radius. The lighting is even and bright, creating a serene and trustworthy navigation interface for a high-end utility application." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAyRpQqK4fUNelktUs2pH4jNKU20tlGE_1xgGT_pt4jU-nh-yZKiJxvrCso7h63jXRwn7tpLa8OBUnZlntPMkYDT0oqpzmme3VHTrJ6flZAikh4poCM1Zag5lwzwq4WE59_OKBNR9eBfFNX98SmA-ebU7JC78RLWfdCsR3LKxmo5TSaD5dx0F8oAfv-jXkrZI8WEF54RnHwIzr22ECDtLQJo6q-M2xrs3Q-PDHhi74KPYLR-pa5UBk-cLiQlAXoQXA6nrYKm5RLKHs"/>
<!-- Marker Overlay -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
<!-- Radius Circle -->
<div class="w-24 h-24 bg-primary-container/20 rounded-full border border-primary-container/40 animate-pulse"></div>
<!-- Pin -->
<div class="absolute mb-8 flex flex-col items-center">
<span class="material-symbols-outlined text-primary-container text-[40px] drop-shadow-md fill-icon" style="font-variation-settings: 'FILL' 1;">location_on</span>
</div>
</div>
<!-- Zoom Controls -->
<div class="absolute bottom-4 left-4 flex flex-col gap-2">
<button class="w-8 h-8 bg-white rounded-lg ios-shadow flex items-center justify-center hover:bg-surface-container-low active:scale-95 transition-all">
<span class="material-symbols-outlined text-on-surface text-[18px]">add</span>
</button>
<button class="w-8 h-8 bg-white rounded-lg ios-shadow flex items-center justify-center hover:bg-surface-container-low active:scale-95 transition-all">
<span class="material-symbols-outlined text-on-surface text-[18px]">remove</span>
</button>
</div>
</div>
<!-- [5] VISIBILITY OPTION -->
<div class="mb-12">
<div class="flex items-center justify-between mb-4">
<label class="font-label-bold text-[13px] text-on-surface">Précision affichée aux acheteurs</label>
<button class="text-secondary hover:text-on-surface transition-colors">
<span class="material-symbols-outlined text-[18px]">info</span>
</button>
</div>
<div class="flex gap-3">
<button class="flex-1 py-3 px-4 rounded-full border border-secondary-container text-secondary font-label-bold text-[12px] hover:border-on-surface transition-all">
                        Quartier
                    </button>
<button class="flex-1 py-3 px-4 rounded-full bg-on-surface text-white font-label-bold text-[12px] shadow-lg shadow-on-surface/20 transition-all">
                        Ville
                    </button>
<button class="flex-1 py-3 px-4 rounded-full border border-secondary-container text-secondary font-label-bold text-[12px] hover:border-on-surface transition-all">
                        Région
                    </button>
</div>
</div>
</section>
<!-- [6] BOTTOM STICKY BUTTON -->
<footer class="absolute bottom-0 left-0 w-full p-4 pb-10 bg-gradient-to-t from-surface via-surface/90 to-transparent pt-8">
<button class="w-full h-14 bg-on-surface text-white rounded-full flex items-center justify-center gap-2 group hover:opacity-90 active:scale-[0.98] transition-all shadow-xl shadow-on-surface/30">
<span class="font-headline-md text-white">Continuer</span>
<span class="material-symbols-outlined transition-transform group-hover:translate-x-1">arrow_forward</span>
</button>
</footer>
</main>
<script>
        // Simple micro-interaction for suggestion clicking
        document.querySelectorAll('.suggestion-row').forEach(row => {
            row.addEventListener('click', () => {
                const text = row.querySelector('span:last-child').innerText;
                document.querySelector('input').value = text;
            });
        });

        // Basic map zoom simulation
        let zoom = 1;
        document.querySelectorAll('button').forEach(btn => {
            if(btn.innerHTML.includes('add')) {
                btn.onclick = () => { zoom = Math.min(zoom + 0.1, 1.5); document.querySelector('img').style.transform = `scale(${zoom})`; };
            }
            if(btn.innerHTML.includes('remove')) {
                btn.onclick = () => { zoom = Math.max(zoom - 0.1, 0.8); document.querySelector('img').style.transform = `scale(${zoom})`; };
            }
        });
    </script>
</body></html>
