services:
  app:
    build: .
    ports:
      - "8000:10000"
    volumes:
      - .:/app
    depends_on:
      - db
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: bizowoop_db
      DB_USERNAME: bizowoop
      DB_PASSWORD: secret
      FILESYSTEM_DISK: local
      QUEUE_CONNECTION: database
      CACHE_STORE: database

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: bizowoop_db
      MYSQL_USER: bizowoop
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql

volumes:
  mysqldata:
