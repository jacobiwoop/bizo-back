name: Expo Android Debug

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "bizo-mobile-rn/**"
      - ".github/workflows/expo-android-debug.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: bizo-mobile-rn

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.6
          cache: npm
          cache-dependency-path: bizo-mobile-rn/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Configure debug Android app
        env:
          ANDROID_DEV_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_DEV_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          node -e '
          const fs = require("fs");
          const appPath = "app.json";
          const app = JSON.parse(fs.readFileSync(appPath, "utf8"));
          app.expo.name = "Bizo Dev";
          app.expo.slug = "bizo-mobile-rn-dev";
          app.expo.android = app.expo.android || {};
          app.expo.android.package = "io.bizo.woop.dev";
          if (process.env.ANDROID_DEV_GOOGLE_SERVICES_JSON_BASE64) {
            fs.writeFileSync("google-services.json", Buffer.from(process.env.ANDROID_DEV_GOOGLE_SERVICES_JSON_BASE64, "base64"));
            app.expo.android.googleServicesFile = "./google-services.json";
          }
          fs.writeFileSync(appPath, `${JSON.stringify(app, null, 2)}\n`);
          '

      - name: Expo prebuild Android
        env:
          CI: "1"
        run: npx expo prebuild --platform android --no-install --clean

      - name: Resolve Firebase notification manifest conflict
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const manifestPath = "android/app/src/main/AndroidManifest.xml";
          const manifest = fs.readFileSync(manifestPath, "utf8");
          const next = manifest.replace(
            /(<meta-data android:name="com\.google\.firebase\.messaging\.default_notification_color" android:resource="[^"]+")(\s*\/>)/,
            '$1 tools:replace="android:resource"$2'
          );

          if (next === manifest) {
            throw new Error("Firebase notification color meta-data was not patched.");
          }

          fs.writeFileSync(manifestPath, next);
          NODE

      - name: Build debug APK
        working-directory: bizo-mobile-rn/android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bizo-mobile-rn-debug-apk
          path: bizo-mobile-rn/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
