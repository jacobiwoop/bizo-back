name: Expo Android Debug

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "bizo-mobile-rn/**"
      - ".github/workflows/expo-android-debug.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: bizo-mobile-rn

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.6
          cache: npm
          cache-dependency-path: bizo-mobile-rn/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Expo prebuild Android
        env:
          CI: "1"
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build debug APK
        working-directory: bizo-mobile-rn/android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bizo-mobile-rn-debug-apk
          path: bizo-mobile-rn/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
