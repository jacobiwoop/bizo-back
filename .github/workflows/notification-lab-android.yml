name: Android Notification Lab

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "notification-lab/**"
      - ".github/workflows/notification-lab-android.yml"

permissions:
  contents: read

jobs:
  build-notification-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: notification-lab

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build notification lab APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload notification lab APK
        uses: actions/upload-artifact@v4
        with:
          name: bizo-notification-lab-debug-apk
          path: notification-lab/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
