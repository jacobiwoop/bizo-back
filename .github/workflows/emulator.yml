name: Expo Android Emulator Session

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-session:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      NODE_ENV: production
      CI: "1"
      EX_DEV_CLIENT_NETWORK_INSPECTOR: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.6
          cache: npm
          cache-dependency-path: bizo-mobile-rn/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install dependencies
        working-directory: bizo-mobile-rn
        run: npm ci

      - name: Typecheck
        working-directory: bizo-mobile-rn
        run: npm run typecheck

      - name: Strip unused production Expo modules
        working-directory: bizo-mobile-rn
        run: |
          node -e '
          const fs = require("fs");
          const appPath = "app.json";
          const app = JSON.parse(fs.readFileSync(appPath, "utf8"));
          const keepPlugins = new Set(["expo-router", "expo-image", "@react-native-firebase/app", "@react-native-firebase/messaging", "@maplibre/maplibre-react-native", "expo-secure-store", "expo-splash-screen", "./plugins/with-native-startup-animation", "expo-image-picker", "expo-notifications", "./plugins/with-firebase-notification-color-replace", "expo-location"]);
          app.expo.plugins = (app.expo.plugins || []).filter((plugin) => keepPlugins.has(Array.isArray(plugin) ? plugin[0] : plugin));
          const keepPermissions = new Set(["android.permission.READ_MEDIA_IMAGES", "android.permission.POST_NOTIFICATIONS", "android.permission.ACCESS_COARSE_LOCATION", "android.permission.ACCESS_FINE_LOCATION"]);
          app.expo.android.permissions = (app.expo.android.permissions || []).filter((permission) => keepPermissions.has(permission));
          fs.writeFileSync(appPath, `${JSON.stringify(app, null, 2)}\n`);
          '
          npm remove expo-dev-client expo-camera expo-sharing --no-save --package-lock=false

      - name: Configure Firebase Android app
        working-directory: bizo-mobile-rn
        env:
          ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > google-services.json
            node -e '
            const fs = require("fs");
            const appPath = "app.json";
            const app = JSON.parse(fs.readFileSync(appPath, "utf8"));
            app.expo.android = app.expo.android || {};
            app.expo.android.googleServicesFile = "./google-services.json";
            fs.writeFileSync(appPath, `${JSON.stringify(app, null, 2)}\n`);
            '
          fi

      - name: Expo prebuild Android
        working-directory: bizo-mobile-rn
        env:
          CI: "1"
        run: npx expo prebuild --platform android --no-install --clean

      - name: Resolve Firebase notification manifest conflict
        working-directory: bizo-mobile-rn
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const manifestPath = "android/app/src/main/AndroidManifest.xml";
          const manifest = fs.readFileSync(manifestPath, "utf8");
          const next = manifest.replace(
            /(<meta-data android:name="com\.google\.firebase\.messaging\.default_notification_color" android:resource="[^"]+")(\s*\/>)/,
            '$1 tools:replace="android:resource"$2'
          );

          if (next === manifest) {
            throw new Error("Firebase notification color meta-data was not patched.");
          }

          fs.writeFileSync(manifestPath, next);
          NODE

      - name: Require Android release signing secrets
        working-directory: bizo-mobile-rn
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

      - name: Configure release signing
        working-directory: bizo-mobile-rn
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/bizo-release.keystore
          perl -0pi -e 's/signingConfigs \{\n        debug \{/signingConfigs {\n        release {\n            storeFile file("bizo-release.keystore")\n            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")\n            keyAlias System.getenv("ANDROID_KEY_ALIAS")\n            keyPassword System.getenv("ANDROID_KEY_PASSWORD")\n        }\n        debug {/s' android/app/build.gradle
          perl -0pi -e 's/signingConfig signingConfigs\.debug/signingConfig signingConfigs.release/g' android/app/build.gradle

      - name: Configure production Gradle flags
        working-directory: bizo-mobile-rn
        run: |
          cat >> android/gradle.properties <<'EOF'

          # CI production emulator session: install the same release app users receive.
          android.enableMinifyInReleaseBuilds=true
          android.enableShrinkResourcesInReleaseBuilds=true
          android.enableBundleCompression=true
          reactNativeArchitectures=armeabi-v7a,arm64-v8a
          EX_DEV_CLIENT_NETWORK_INSPECTOR=false
          expo.gif.enabled=false
          expo.webp.enabled=true
          expo.webp.animated=false
          EOF

      - name: Build production APK
        working-directory: bizo-mobile-rn/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean :app:assembleRelease \
            -PreactNativeArchitectures=armeabi-v7a,arm64-v8a \
            -Pandroid.enableMinifyInReleaseBuilds=true \
            -Pandroid.enableShrinkResourcesInReleaseBuilds=true \
            -Pandroid.enableBundleCompression=true \
            -PEX_DEV_CLIENT_NETWORK_INSPECTOR=false \
            -Pexpo.gif.enabled=false \
            -Pexpo.webp.animated=false

      - name: Start docker-android emulator
        run: |
          docker run -d \
            --name android-emulator \
            --device /dev/kvm \
            -p 6080:6080 \
            -v "$PWD/bizo-mobile-rn/android/app/build/outputs/apk/release:/apk" \
            -e EMULATOR_DEVICE="Samsung Galaxy S10" \
            -e WEB_VNC=true \
            -e APPIUM=false \
            budtmo/docker-android:emulator_11.0

      - name: Wait for emulator to boot
        run: |
          docker exec android-emulator adb wait-for-device
          for i in $(seq 1 60); do
            BOOTED=$(docker exec android-emulator adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$BOOTED" = "1" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Emulator did not finish booting in time"
          docker logs android-emulator | tail -n 200
          exit 1

      - name: Install APK
        run: |
          APK_PATH=$(docker exec android-emulator sh -lc 'ls /apk/*.apk | head -1')
          docker exec android-emulator adb install -r "$APK_PATH"

      - name: Clear emulator logs
        run: docker exec android-emulator adb logcat -c

      - name: Launch Bizo on emulator
        run: |
          docker exec android-emulator adb shell monkey -p io.bizo.woop -c android.intent.category.LAUNCHER 1

      - name: Verify Bizo stays open
        run: |
          sleep 20
          if docker exec android-emulator adb shell pidof io.bizo.woop >/tmp/bizo-pid.txt; then
            echo "Bizo is running with pid: $(cat /tmp/bizo-pid.txt)"
            exit 0
          fi

          echo "Bizo is not running after launch. Recent crash logs:"
          docker exec android-emulator adb logcat -d -v time \
            AndroidRuntime:E ReactNative:V ReactNativeJS:V Expo:V expo:V unknown:D '*:S' \
            | tail -n 300
          exit 1

      - name: Install cloudflared
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o cloudflared
          chmod +x cloudflared

      - name: Start tunnel and display URL
        run: |
          ./cloudflared tunnel --url http://localhost:6080 > /tmp/cloudflared.log 2>&1 &
          sleep 8
          grep -o 'https://.*\.trycloudflare\.com' /tmp/cloudflared.log | head -1

      - name: Keep session alive
        run: sleep 21600

      - name: Dump emulator logs on failure
        if: failure()
        run: |
          docker logs android-emulator | tail -n 200
          echo
          echo "==> Filtered app logcat"
          docker exec android-emulator adb logcat -d -v time \
            AndroidRuntime:E ReactNative:V ReactNativeJS:V Expo:V expo:V unknown:D '*:S' \
            | tail -n 300 || true
